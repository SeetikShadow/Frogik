    <script>
        /*
        Задание:
        Сделайте так, чтобы класс Truck наследовался от класса Car.
        Переопределит метод move, в классе Truck - 
        Если в грузовик загружено менее 500 кг груза, должна срабатывать реализация метода из класса Car
        Если в грузовик загружено более 500 кг, должно выводиться сообщение "Грузовик движется со скоростью 50 км/час."
        */

        class Car
        {
            moving()
            {
                console.log("The Car is riding");
            }
        }
        class Truck extends Car
        {
            weight = 0;
           loadCargo(weight)
           {
            if (weight > 1000)
            {
                console.log("This Lory(truck) can't have 1000 kg...");
            }       
            else        
            {           
                this.weight = weight;           
                console.log(`The lory is loaded on: ${this.weight}kg.`);
            }    
           }
           moving()
           {
            if (this.weight < 500)
            {
                 super.move();
            }       
            else if (this.weight > 500)        
            {
                 console.log("The lory is moving on 50km/h.");
            }
           }
        }
        let v1 = new Car();
        v1.move();
        let v2 = new Truck();
        v2.loadCargo(1500);
        v2.loadCargo(990);
        v2.move();
        let v3 = new Truck();
        v3.loadCargo(100);
        v3.move();
